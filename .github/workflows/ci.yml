name: Ro-KDE-SystemSettings CI

"on":
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ro-kde-systemsettings-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LANG: C.UTF-8

jobs:
  contract:
    name: Repository Contract
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate repository contract
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml
          python3 scripts/validate.py
          /usr/bin/python3 tests/test-contract.py
          bash tests/check-workflows.sh

  rpm-build-and-test:
    name: Fedora 44 RPM Build & Verification (x86_64)
    needs: contract
    runs-on: ubuntu-24.04
    container:
      image: fedora:44
    timeout-minutes: 60
    steps:
      - name: Install build tools and dependencies
        run: |
          dnf install -y git python3 gettext rpm-build rpmdevtools rpmlint cmake gcc-c++ \
            kf6-rpm-macros qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtquickcontrols2-devel \
            desktop-file-utils plasma-systemsettings kf6-kirigami dbus-daemon \
            kf6-kcmutils-devel kf6-kconfig-devel kf6-kcoreaddons-devel kf6-kauth-devel kf6-ki18n-devel python3-pyyaml

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Mark git directory safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build RPM and SRPM
        run: bash tests/test-build-rpm.sh

      - name: Collect exact RPM set and validate manifests
        run: bash tests/test-bundle.sh

      - name: Download pinned previous release for actual upgrade test
        run: bash tests/fetch-previous-rpm.sh

      - name: Install, launch, upgrade, remove and verify Fedora integrity
        run: bash tests/run-fedora44.sh "" .work/previous.rpm

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ro-kde-systemsettings-rpms-x86_64
          path: release-rpms/*
          if-no-files-found: error
          retention-days: 7
