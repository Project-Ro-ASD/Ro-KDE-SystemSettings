name: Ro-KDE-SystemSettings CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ro-kde-systemsettings-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Repository Contract
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate repository contract
        run: python3 scripts/validate.py

  rpm-build-and-test:
    name: Fedora 44 RPM Build & Verification (x86_64)
    needs: contract
    runs-on: ubuntu-24.04
    container:
      image: fedora:44
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install build tools and dependencies
        run: |
          dnf install -y git python3 gettext rpm-build rpmdevtools rpmlint cmake gcc-c++ \
            kf6-rpm-macros qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtquickcontrols2-devel \
            desktop-file-utils plasma-systemsettings kf6-kirigami

      - name: Mark git directory safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build RPM and SRPM
        run: bash tests/test-build-rpm.sh

      - name: Run rpmlint (advisory)
        run: |
          rpmlint "$HOME/rpmbuild/RPMS/x86_64/"*.rpm "$HOME/rpmbuild/SRPMS/"*.rpm || \
            echo "::warning::rpmlint reported issues (advisory)"

      - name: Run smoke test
        run: bash tests/test-smoke.sh

      - name: Test clean installation
        run: bash tests/test-clean-install.sh

      - name: Test file conflicts against Fedora packages
        run: bash tests/test-file-conflicts.sh

      - name: Offscreen execution smoke test
        run: |
          QT_QPA_PLATFORM=offscreen /usr/bin/ro-systemsettings --help >/dev/null

      - name: Test package removal and KDE integrity
        run: bash tests/test-upgrade-remove.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ro-kde-systemsettings-rpms-x86_64
          path: /root/rpmbuild/RPMS/x86_64/*.rpm
          if-no-files-found: error
          retention-days: 7
