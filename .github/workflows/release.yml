name: Release

# Ro-Repo V2 producer release for Ro-KDE-SystemSettings.
# Tag vX.Y.Z = component version (VERSION).

"on":
  push:
    tags:
      - "v*"
  # Dry run: builds and tests the RPMs without creating a release.
  workflow_dispatch:

permissions:
  contents: read

env:
  LANG: C.UTF-8
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Resolve Release Metadata
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      rpm_version: ${{ steps.meta.outputs.rpm_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate exact tag, component version and repository contract
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          COMPONENT_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            TAG="${GITHUB_REF_NAME}"
            [[ "${TAG}" == "v${COMPONENT_VERSION}" ]]
          else
            TAG="dry-run"
          fi
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]]
          python3 scripts/validate.py
          python3 scripts/check-license-audit.py
          python3 tests/test-launcher.py
          python3 tests/test-license-audit.py

          RPM_VERSION="$(awk '/^Version:/ { print $2; exit }' packaging/fedora/ro-kde-systemsettings.spec)"
          [[ "${RPM_VERSION}" == "${COMPONENT_VERSION}" ]]

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "rpm_version=${RPM_VERSION}" >> "${GITHUB_OUTPUT}"

  rpm:
    name: Build Fedora 44 Ro-KDE-SystemSettings RPMs (x86_64)
    needs: metadata
    runs-on: ubuntu-24.04
    container:
      image: fedora:44
    timeout-minutes: 60
    steps:
      - name: Install build tools and dependencies
        run: |
          dnf install -y git python3 gettext rpm-build rpmdevtools rpmlint cmake gcc-c++ \
            kf6-rpm-macros qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtquickcontrols2-devel \
            desktop-file-utils plasma-systemsettings kf6-kirigami dbus-daemon \
            kf6-kcmutils-devel kf6-kconfig-devel kf6-kcoreaddons-devel kf6-kauth-devel kf6-ki18n-devel plasma-workspace-libs python3-pyyaml

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Mark git directory safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build RPM and SRPM
        run: bash tests/test-build-rpm.sh

      - name: Collect exact RPM set, lint and validate manifests
        run: bash tests/test-bundle.sh

      - name: Download pinned previous release for actual upgrade test
        run: bash tests/fetch-previous-rpm.sh

      - name: Install, launch, upgrade, remove and verify Fedora integrity
        run: bash tests/run-fedora44.sh "" .work/previous.rpm

      - name: Upload RPM bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-rpms-x86_64
          path: release-rpms/*.rpm
          if-no-files-found: error
          retention-days: 7

  attest-dry-run:
    name: Verify provenance without publishing
    needs: [metadata, rpm]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: dry-run
      RELEASE_ID: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-rpms-x86_64
          path: bundle
      - name: Generate dry-run manifest
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          python3 scripts/generate-manifest.py bundle
          (cd bundle && sha256sum -c SHA256SUMS)
      - name: Attest dry-run bundle
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            bundle/*.rpm
            bundle/SHA256SUMS
            bundle/component-artifact-manifest-v1.json
      - name: Verify workflow identity and subjects
        run: |
          for file in bundle/*; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$GITHUB_SHA"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dry-run-attested-bundle
          path: bundle/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish V2 Contract Release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    needs: [metadata, rpm]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.metadata.outputs.tag }}

    steps:
      - name: Checkout trusted workflow source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download RPM bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-rpms-*
          path: bundle
          merge-multiple: true

      - name: Install RPM query tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm jq

      - name: Validate exact RPM set
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t RPMS < <(find bundle -maxdepth 1 -type f -name '*.rpm' -printf '%f\n' | sort)
          printf '%s\n' "${RPMS[@]}"
          [[ "${#RPMS[@]}" -eq 2 ]]
          [[ "$(printf '%s\n' "${RPMS[@]}" | grep -c '\.x86_64\.rpm$')" -eq 1 ]]
          [[ "$(printf '%s\n' "${RPMS[@]}" | grep -c '\.src\.rpm$')" -eq 1 ]]
          if printf '%s\n' "${RPMS[@]}" | grep -qE 'debuginfo|debugsource'; then exit 1; fi
          if find bundle -maxdepth 1 -type f -name '*.rpm' | grep -qE '/.*(fc4[0-3]|fc45).*\.rpm$'; then exit 1; fi

      - name: Create new draft release
        id: draft
        shell: bash
        run: |
          set -euo pipefail
          # Never delete/reuse an existing draft or published release.
          EXISTING_COUNT="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --slurp \
            --jq '[.[][] | select(.tag_name == env.TAG)] | length')"
          [[ "$EXISTING_COUNT" == 0 ]] || { echo 'Release already exists; refusing reuse.' >&2; exit 1; }

          RELEASE_JSON="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="${TAG}" \
            -f target_commitish="${GITHUB_SHA}" \
            -f name="${TAG}" \
            -F draft=true \
            -F generate_release_notes=true)"
          RELEASE_ID="$(jq -r '.id' <<<"${RELEASE_JSON}")"
          [[ "${RELEASE_ID}" =~ ^[0-9]+$ ]]
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"

      - name: Generate strict checksums and component manifest
        env:
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate-manifest.py bundle
          (cd bundle && sha256sum -c SHA256SUMS)

      - name: Attest exact release bundle
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            bundle/*.rpm
            bundle/SHA256SUMS
            bundle/component-artifact-manifest-v1.json

      - name: Upload complete bundle to draft release
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            bundle/*.rpm \
            bundle/SHA256SUMS \
            bundle/component-artifact-manifest-v1.json

      - name: Verify draft assets and publish
        env:
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t EXPECTED < <(
            { find bundle -maxdepth 1 -type f -name '*.rpm' -printf '%f\n'; printf '%s\n' SHA256SUMS component-artifact-manifest-v1.json; } | sort
          )
          mapfile -t ACTUAL < <(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --paginate --jq '.[].name' | sort)
          [[ "${#EXPECTED[@]}" -eq 4 ]]
          diff -u <(printf '%s\n' "${EXPECTED[@]}") <(printf '%s\n' "${ACTUAL[@]}")

          mkdir /tmp/verify-release
          gh release download "$TAG" --dir /tmp/verify-release
          for file in bundle/*; do
            cmp "$file" "/tmp/verify-release/$(basename "$file")"
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$GITHUB_SHA"
          done
          gh release edit "$TAG" --draft=false
          [[ "$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '.immutable')" == true ]]
